<body>
  <canvas id="c"></canvas>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }
  </style>
  <script>
    /*
	   	function componentToHex(c) {
		 		var hex = c.toString(16);
		 		return hex.length == 1 ? "0" + hex : hex;
	   	}

	   	function rgbToHex(r, g, b) {
		 		return "#" + componentToHex(r) + componentToHex(g) + componentToHex(b);
	   	}
	*/
    function getPixelColor(x, y) {
      const pixel = ctx.getImageData(x, y, 1, 1).data;
      return { r: pixel[0], g: pixel[1], b: pixel[2], a: pixel[3] };
    }
    const ctx = c.getContext("2d");

    // variables for the entire app
    let player = { x: 100, y: 100, direction: "d" }; // d = down u = up to save space
    let map = { x: 400 };
    let mouseDown = false;

    document.addEventListener("mousedown", () => {
      mouseDown = true;
    });
    document.addEventListener("mouseup", () => {
      mouseDown = false;
    });
    function update(dt) {
      if (mouseDown) {
        player.direction = "u";
      } else {
        player.direction = "d";
      }
      let pixelAtPlayerCoord = getPixelColor(player.x, player.y);
      if (player.direction == "d") {
        player.y += 1;
        let pixelAtPlayerCoordOffset1 = getPixelColor(
          player.x + 20,
          player.y - 20,
        );
        let pixelAtPlayerCoordOffset2 = getPixelColor(
          player.x + 40,
          player.y + 20,
        );
        if (
          pixelAtPlayerCoord.g == 128 ||
          pixelAtPlayerCoordOffset1.g == 128 ||
          pixelAtPlayerCoordOffset2.g == 128
        ) {
          console.log("collision");
        }
      } else {
        player.y -= 1;
        let pixelAtPlayerCoordOffset1 = getPixelColor(
          player.x - 20,
          player.y - 20,
        );
        let pixelAtPlayerCoordOffset2 = getPixelColor(
          player.x + 20,
          player.y - 40,
        );
        if (
          pixelAtPlayerCoord.g == 128 ||
          pixelAtPlayerCoordOffset1.g == 128 ||
          pixelAtPlayerCoordOffset2.g == 128
        ) {
          console.log("collision");
        }
      }
      map.x -= 2;
    }

    function draw(time) {
      // draw sprite
      ctx.fillStyle = "black";
      ctx.fillRect(0, 0, c.width, c.height);
      // debug: draw red dots
      /*ctx.fillStyle = "red";
			 ctx.beginPath();
			 ctx.arc(player.x, player.y, 5, 0, 2 * Math.PI);
			 ctx.fill();
			 ctx.stroke();*/

      ctx.fillStyle = "white";
      ctx.beginPath();
      if (player.direction == "d") {
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(player.x + 20, player.y - 20);
        ctx.lineTo(player.x + 40, player.y + 20);
      } else {
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(player.x - 20, player.y - 20);
        ctx.lineTo(player.x + 20, player.y - 40);
      }

      ctx.fill();
      ctx.fillStyle = "green";
      // draw map
      ctx.fillRect(map.x, 0, 200, 200);
      ctx.fillRect(map.x, c.height, 200, 400);
    }

    onresize = () => {
      c.width = innerWidth;
      c.height = innerHeight;
    };
    onresize();

    let last = 0;
    function frame(now) {
      update(Math.min((now - last) / 1000, 0.1));
      last = now;
      draw(now);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
