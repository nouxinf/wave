<body>
  <canvas id="c"></canvas>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }
  </style>
  <script>
    onresize = () => {
      c.width = innerWidth;
      c.height = innerHeight;
    };
    onresize();
    function getPixelColor(x, y) {
      const pixel = ctx.getImageData(x, y, 1, 1).data;
      return { r: pixel[0], g: pixel[1], b: pixel[2], a: pixel[3] };
    }
    const ctx = c.getContext("2d");

    // variables for the entire app
    let player = { x: 100, y: c.height / 2, direction: "d" }; // d = down u = up to save space

    const seed = Math.floor(
      Math.random() * (100000000 - 999999999) + 999999999,
    ).toString();
    const obsWidths = [200, 600, 200, 200, 720, 0, 0, 0, 0];
    let map = { x: 400 };

    let movingY = c.height / 2;
    let subtracting = false;

    const drawObs = (x, obsNum) => {
      if (obsNum == "0") {
        // flappy bird style pipes
        ctx.fillRect(x, 0, 200, c.height / 2 - c.height / 7);
        ctx.fillRect(
          x,
          c.height - (c.height / 2 - c.height / 5),
          200,
          c.height / 2 - c.height / 5,
        );
      } else if (obsNum == "1") {
        // wide obstacle at the top
        ctx.fillRect(x, 0, 600, c.height / 1.5);
      } else if (obsNum == "2") {
        // tall obstacle coming out the bottom
        ctx.fillRect(
          x,
          c.height - (c.height / 2 + c.height / 7),
          200,
          c.height / 2 + c.height / 7,
        );
      } else if (obsNum == "3") {
        // tall obstacle coming out the top
        ctx.fillRect(x, 0, 200, c.height / 2 + c.height / 7);
      } else if (obsNum == "4") {
        const spikeCount = 6;
        const spikeWidth = 80;
        const gap = 80;
        const spikeHeight = c.height * 0.6;

        for (let i = 0; i < spikeCount; i++) {
          const x0 = x + i * (spikeWidth + gap);
          ctx.beginPath();
          if (i % 2 === 0) {
            // spike hanging down from the ceiling
            ctx.moveTo(x0, 0);
            ctx.lineTo(x0 + spikeWidth / 2, spikeHeight);
            ctx.lineTo(x0 + spikeWidth, 0);
          } else {
            // spike pointing up from the floor
            ctx.moveTo(x0, c.height);
            ctx.lineTo(x0 + spikeWidth / 2, c.height - spikeHeight);
            ctx.lineTo(x0 + spikeWidth, c.height);
          }
          ctx.closePath();
          ctx.fill();
        }
      } else if (obsNum == "5") {
        ctx.beginPath();
        ctx.arc(x, movingY, 50, 0, 2 * Math.PI);
        ctx.fill();
        ctx.stroke();
        if (movingY > c.height - 50) {
          subtracting = true;
        } else if (movingY < 50) {
          subtracting = false;
        }
        if (subtracting) {
          movingY--;
        } else {
          movingY++;
        }
      }
    };
    let mouseDown = false;
    let gameOver = false;

    document.addEventListener("mousedown", () => {
      mouseDown = true;
    });
    document.addEventListener("mouseup", () => {
      mouseDown = false;
    });

    function drawMap() {
      let x = map.x;
      for (let i = 0; i < seed.length; i++) {
        const type = parseInt(seed[i], 10);
        drawObs(x, type);
        x += (obsWidths[type] ?? 200) + 500;
      }
    }

    function update(dt) {
      if (mouseDown) {
        player.direction = "u";
      } else {
        player.direction = "d";
      }
      let pixelAtPlayerCoord = getPixelColor(player.x, player.y);
      if (player.direction == "d") {
        player.y += 4;
        let pixelAtPlayerCoordOffset1 = getPixelColor(
          player.x + 20,
          player.y - 20,
        );
        let pixelAtPlayerCoordOffset2 = getPixelColor(
          player.x + 40,
          player.y + 20,
        );
        if (
          pixelAtPlayerCoord.g == 128 ||
          pixelAtPlayerCoordOffset1.g == 128 ||
          pixelAtPlayerCoordOffset2.g == 128 ||
          player.y >= c.height - 20
        ) {
          gameOver = true;
        }
      } else {
        player.y -= 4;
        let pixelAtPlayerCoordOffset1 = getPixelColor(
          player.x - 20,
          player.y - 20,
        );
        let pixelAtPlayerCoordOffset2 = getPixelColor(
          player.x + 20,
          player.y - 40,
        );
        if (
          pixelAtPlayerCoord.g == 128 ||
          pixelAtPlayerCoordOffset1.g == 128 ||
          pixelAtPlayerCoordOffset2.g == 128 ||
          player.y <= 40
        ) {
          gameOver = true;
        }
      }
      map.x -= 2;
    }

    function draw(time) {
      // draw sprite
      ctx.fillStyle = "black";
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.fillStyle = "white";
      ctx.beginPath();
      if (player.direction == "d") {
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(player.x + 20, player.y - 20);
        ctx.lineTo(player.x + 40, player.y + 20);
      } else {
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(player.x - 20, player.y - 20);
        ctx.lineTo(player.x + 15, player.y - 40);
      }

      ctx.fill();
      ctx.fillStyle = "green";
      // draw map
      console.log(seed);
      drawMap();
      if (gameOver) {
        ctx.font = "48px sans-serif";
        ctx.fillStyle = "white";
        ctx.fillText("game over", c.width / 2, c.height / 2);
      }
    }

    let last = 0;
    function frame(now) {
      if (!gameOver) {
        last = now;
        draw(now);
        requestAnimationFrame(frame);
        update(Math.min((now - last) / 1000, 0.1));
      } else {
        draw(now);
        document.addEventListener("mousedown", () => location.reload(), {
          once: true,
        });
      }
    }
    requestAnimationFrame(frame);
  </script>
</body>
