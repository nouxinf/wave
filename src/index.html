<body>
  <canvas id="c"></canvas>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }
  </style>
  <script>
    onresize = () => {
      c.width = innerWidth;
      c.height = innerHeight;
    };
    onresize();
    function getPixelColor(x, y) {
      const pixel = ctx.getImageData(x, y, 1, 1).data;
      return { r: pixel[0], g: pixel[1], b: pixel[2], a: pixel[3] };
    }
    const ctx = c.getContext("2d");

    // variables for the entire app
    let player = { x: 100, y: c.height / 2, direction: "d" }; // d = down u = up to save space
    console.log(c.height);
    let map = { x: 400 };
    let mouseDown = false;
    let gameOver = false;

    document.addEventListener("mousedown", () => {
      mouseDown = true;
    });
    document.addEventListener("mouseup", () => {
      mouseDown = false;
    });
    function update(dt) {
      if (mouseDown) {
        player.direction = "u";
      } else {
        player.direction = "d";
      }
      let pixelAtPlayerCoord = getPixelColor(player.x, player.y);
      if (player.direction == "d") {
        player.y += 1;
        let pixelAtPlayerCoordOffset1 = getPixelColor(
          player.x + 20,
          player.y - 20,
        );
        let pixelAtPlayerCoordOffset2 = getPixelColor(
          player.x + 40,
          player.y + 20,
        );
        if (
          pixelAtPlayerCoord.g == 128 ||
          pixelAtPlayerCoordOffset1.g == 128 ||
          pixelAtPlayerCoordOffset2.g == 128 ||
          player.y >= c.height - 20
        ) {
          gameOver = true;
        }
      } else {
        player.y -= 1;
        let pixelAtPlayerCoordOffset1 = getPixelColor(
          player.x - 20,
          player.y - 20,
        );
        let pixelAtPlayerCoordOffset2 = getPixelColor(
          player.x + 20,
          player.y - 40,
        );
        if (
          pixelAtPlayerCoord.g == 128 ||
          pixelAtPlayerCoordOffset1.g == 128 ||
          pixelAtPlayerCoordOffset2.g == 128 ||
          player.y <= 40
        ) {
          gameOver = true;
        }
      }
      map.x -= 2;
    }

    function draw(time) {
      // draw sprite
      ctx.fillStyle = "black";
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.fillStyle = "white";
      ctx.beginPath();
      if (player.direction == "d") {
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(player.x + 20, player.y - 20);
        ctx.lineTo(player.x + 40, player.y + 20);
      } else {
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(player.x - 20, player.y - 20);
        ctx.lineTo(player.x + 20, player.y - 40);
      }

      ctx.fill();
      ctx.fillStyle = "green";
      // draw map
      ctx.fillRect(map.x, 0, 200, 200);
      ctx.fillRect(map.x, c.height, 200, 400);
      if (gameOver) {
        ctx.font = "48px sans-serif";
        ctx.fillStyle = "white";
        ctx.fillText("game over", c.width / 2, c.height / 2);
      }
    }

    let last = 0;
    function frame(now) {
      if (!gameOver) {
        last = now;
        draw(now);
        requestAnimationFrame(frame);
        update(Math.min((now - last) / 1000, 0.1));
      } else {
        draw(now);
        document.addEventListener("click", () => {
          window.location.reload();
        });
      }
    }
    requestAnimationFrame(frame);
  </script>
</body>
