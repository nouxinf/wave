<body>
  <canvas id="c"></canvas>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }
  </style>
  <script>
    const ctx = c.getContext("2d");

    // variables for the entire app
    let player = { x: 100, y: 100, direction: "d" }; // d = down u = up to save space
    let map = { x: 400 };
    let mouseDown = false;

    document.addEventListener("mousedown", () => {
      mouseDown = true;
    });
    document.addEventListener("mouseup", () => {
      mouseDown = false;
    });
    function update(dt) {
      if (mouseDown) {
        player.direction = "u";
      } else {
        player.direction = "d";
      }
      if (player.direction == "d") {
        player.y += 1;
      } else {
        player.y -= 1;
      }
      map.x -= 2;
    }

    function draw(time) {
      // draw sprite
      ctx.fillStyle = "black";
      ctx.fillRect(0, 0, c.width, c.height);
      // debug: draw red dots
      /*ctx.fillStyle = "red";
      ctx.beginPath();
      ctx.arc(player.x, player.y, 5, 0, 2 * Math.PI);
      ctx.fill();
      ctx.stroke();*/

      ctx.fillStyle = "white";
      ctx.beginPath();
      if (player.direction == "d") {
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(player.x + 20, player.y - 20);
        ctx.lineTo(player.x + 40, player.y + 20);
      } else {
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(player.x - 20, player.y - 20);
        ctx.lineTo(player.x + 20, player.y - 40);
      }

      ctx.fill();
      ctx.fillStyle = "green";
      // draw map
      ctx.fillRect(map.x, 0, 200, 200);
    }

    onresize = () => {
      c.width = innerWidth;
      c.height = innerHeight;
    };
    onresize();

    let last = 0;
    function frame(now) {
      update(Math.min((now - last) / 1000, 0.1));
      last = now;
      draw(now);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
