<body>
  <canvas id="c"></canvas>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }
  </style>
  <script>
    let started = false;
    let hscore = +location.hash.slice(1) || 0;

    const aCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(
      freq = 440,
      duration = 0.15,
      type = "sine",
      volume = 0.2,
      endFreq = freq,
      when = 0,
    ) {
      const t = aCtx.currentTime + when;
      const gain = aCtx.createGain();
      gain.gain.setValueAtTime(volume, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
      let src;
      if (type === "noise") {
        // White noise through a low-pass filter. freq is the cutoff.
        const len = Math.ceil(aCtx.sampleRate * duration);
        const buf = aCtx.createBuffer(1, len, aCtx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
        src = aCtx.createBufferSource();
        src.buffer = buf;
        const lp = aCtx.createBiquadFilter();
        lp.type = "lowpass";
        lp.frequency.setValueAtTime(freq, t);
        lp.frequency.exponentialRampToValueAtTime(endFreq, t + duration);
        src.connect(lp).connect(gain);
      } else {
        src = aCtx.createOscillator();
        src.type = type;
        src.frequency.setValueAtTime(freq, t);
        src.frequency.exponentialRampToValueAtTime(endFreq, t + duration);
        src.connect(gain);
      }
      gain.connect(aCtx.destination);
      src.start(t);
      src.stop(t + duration);
    }
    function blip() {
      beep(4413, 0.13, "noise", 0.5, 6000);
      beep(2624, 0.13, "noise", 0.5, 3568, 0.135);
      beep(1560, 0.13, "noise", 0.5, 2121, 0.27);
    }
    onresize = () => {
      c.width = innerWidth;
      c.height = innerHeight;
    };
    onresize();
    W = c.width;
    H = c.height;
    function getPixelColor(x, y) {
      const pixel = ctx.getImageData(x, y, 1, 1).data;
      return { r: pixel[0], g: pixel[1], b: pixel[2], a: pixel[3] };
    }
    const ctx = c.getContext("2d");
    const f = ctx.fillRect.bind(ctx);

    // variables for the entire app
    let player = { x: 100, y: H / 2, direction: "d" }; // d = down u = up to save space

    const seed = Math.floor(
      Math.random() * (100000000 - 999999999) + 999999999,
    ).toString();
    const obsWidths = [
      200,
      600,
      200,
      200,
      720,
      100,
      100 * Math.floor(H / 120),
      300,
      100 * Math.floor(H / 120),
      0,
    ];
    let map = { x: 400 };

    let movingY = H / 2;
    let subtracting = false;

    const drawObs = (x, obsNum) => {
      if (obsNum == "0") {
        // flappy bird style pipes
        f(x, 0, 200, H / 2 - H / 7);
        f(x, H - (H / 2 - H / 5), 200, H / 2 - H / 5);
      } else if (obsNum == "1") {
        // wide obstacle at the top
        f(x, 0, 600, H / 1.5);
      } else if (obsNum == "2") {
        // tall obstacle coming out the bottom
        f(x, H - (H / 2 + H / 7), 200, H / 2 + H / 7);
      } else if (obsNum == "3") {
        // tall obstacle coming out the top
        f(x, 0, 200, H / 2 + H / 7);
      } else if (obsNum == "4") {
        const spikeCount = 6;
        const spikeWidth = 80;
        const gap = 80;
        const spikeHeight = H * 0.6;

        for (let i = 0; i < spikeCount; i++) {
          const x0 = x + i * (spikeWidth + gap);
          ctx.beginPath();
          if (i % 2 === 0) {
            // spike hanging down from the ceiling
            ctx.moveTo(x0, 0);
            ctx.lineTo(x0 + spikeWidth / 2, spikeHeight);
            ctx.lineTo(x0 + spikeWidth, 0);
          } else {
            // spike pointing up from the floor
            ctx.moveTo(x0, H);
            ctx.lineTo(x0 + spikeWidth / 2, H - spikeHeight);
            ctx.lineTo(x0 + spikeWidth, H);
          }
          ctx.closePath();
          ctx.fill();
        }
      } else if (obsNum == "5") {
        // circle that moves up and down
        ctx.beginPath();
        ctx.arc(x, movingY, 50, 0, 2 * Math.PI);
        ctx.fill();
        ctx.stroke();
        if (movingY > H - 50) {
          subtracting = true;
        } else if (movingY < 50) {
          subtracting = false;
        }
        if (subtracting) {
          movingY--;
        } else {
          movingY++;
        }
      } else if (obsNum == "6") {
        // staircase that goes up then down
        const n = Math.floor(H / 120);

        for (let i = 0; i < n; i++) {
          f(x + i * 100, H - i * 100, 100, i * 100);
        }
        for (let j = 0; j < n - 1; j++) {
          const i = n - 1 - j;
          f(x + (n - 1 + j) * 100, H - i * 100, 100, i * 100);
        }
      } else if (obsNum == "7") {
        // floating diamond shape
        ctx.beginPath();
        ctx.moveTo(x, c.height / 2);
        ctx.lineTo(x + 150, c.height / 2 - c.height * 0.2);
        ctx.lineTo(x + 300, c.height / 2);
        ctx.lineTo(x + 150, c.height / 2 + c.height * 0.2);
        ctx.closePath();
        ctx.fill();
      } else if (obsNum == "8") {
        // upside down staircase
        const n = Math.floor(H / 120);

        for (let i = 0; i < n; i++) {
          f(x + i * 100, 0, 100, i * 100);
        }
        for (let j = 0; j < n - 1; j++) {
          const i = n - 1 - j;
          f(x + (n - 1 + j) * 100, 0, 100, i * 100);
        }
      } else if (obsNum == "9") {
        // rect in the middle
        f(x, 0 + H / 4, 200, H / 2);
      }
    };
    let mouseDown = false;
    let gameOver = false;

    document.addEventListener("mousedown", () => {
      mouseDown = true;
    });
    document.addEventListener("mouseup", () => {
      mouseDown = false;
    });

    function drawMap() {
      let x = map.x;
      for (let i = 0; i < seed.length; i++) {
        const type = parseInt(seed[i], 10);
        drawObs(x, type);
        x += (obsWidths[type] ?? 200) + 500;
      }
    }

    function update(dt) {
      if (mouseDown) {
        player.direction = "u";
        if (!started) {
          started = true;
        }
      } else {
        player.direction = "d";
      }
      if (started) {
        let pixelAtPlayerCoord = getPixelColor(player.x, player.y);
        if (player.direction == "d") {
          player.y += 4;
          let pixelAtPlayerCoordOffset1 = getPixelColor(
            player.x + 20,
            player.y - 20,
          );
          let pixelAtPlayerCoordOffset2 = getPixelColor(
            player.x + 40,
            player.y + 20,
          );
          if (
            pixelAtPlayerCoord.g == 128 ||
            pixelAtPlayerCoordOffset1.g == 128 ||
            pixelAtPlayerCoordOffset2.g == 128 ||
            player.y >= H - 20
          ) {
            gameOver = true;
          }
        } else {
          player.y -= 4;
          let pixelAtPlayerCoordOffset1 = getPixelColor(
            player.x - 20,
            player.y - 20,
          );
          let pixelAtPlayerCoordOffset2 = getPixelColor(
            player.x + 20,
            player.y - 40,
          );
          if (
            pixelAtPlayerCoord.g == 128 ||
            pixelAtPlayerCoordOffset1.g == 128 ||
            pixelAtPlayerCoordOffset2.g == 128 ||
            player.y <= 40
          ) {
            gameOver = true;
          }
        }
        map.x -= 2;
      }
    }

    function draw(time) {
      // draw sprite
      ctx.fillStyle = "black";
      f(0, 0, W, H);
      ctx.fillStyle = "white";
      ctx.beginPath();
      if (player.direction == "d") {
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(player.x + 20, player.y - 20);
        ctx.lineTo(player.x + 40, player.y + 20);
      } else {
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(player.x - 20, player.y - 20);
        ctx.lineTo(player.x + 15, player.y - 40);
      }

      ctx.fill();
      ctx.fillStyle = "green";
      // draw map
      console.log(seed);
      drawMap();
      if (gameOver) {
        ctx.font = "48px monospace";
        ctx.fillStyle = "white";
        ctx.fillText("game over", W / 2, H / 2);
        blip();
        if ((map.x - 400) * -1 > hscore) {
          location.hash = (map.x - 400) * -1;
          ctx.font = "20px monospace";
          ctx.fillText("new high score!", W - 200, 100);
        }
        ctx.font = "48px monospace";
        ctx.fillText(((map.x - 400) * -1).toString(), W - 200, 50);
      } else {
        ctx.fillStyle = "white";
        ctx.fillText(hscore.toString(), W - 100, 50);
      }
      if (!started) {
        ctx.textAlign = "center";
        ctx.font = "48px monospace";
        ctx.fillStyle = "white";
        ctx.fillText("Click anywhere to start", W / 2, H / 2);
        ctx.font = "30px monospace";
        ctx.fillText("click to go up, let go to go down", W / 2, H / 2 + 50);
      }
      // score text
      ctx.fillStyle = "white";
      ctx.textAlign = "left";
      ctx.fillText(((map.x - 400) * -1).toString(), 50, 50);
    }

    let last = 0;
    function frame(now) {
      if (!gameOver) {
        last = now;
        draw(now);
        requestAnimationFrame(frame);
        update(Math.min((now - last) / 1000, 0.1));
      } else {
        draw(now);
        document.addEventListener("mousedown", () => location.reload(), {
          once: true,
        });
      }
    }
    requestAnimationFrame(frame);
  </script>
</body>
